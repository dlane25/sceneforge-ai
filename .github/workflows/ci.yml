name: Launch quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_MODE: mock
      MEDIA_PROVIDER: mock
      IMAGE_PROVIDER: mock
      VIDEO_PROVIDER: mock
      AUDIO_PROVIDER: mock
      EXPORT_ENGINE: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:launch
